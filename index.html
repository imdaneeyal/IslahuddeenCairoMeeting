<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Islahuddeen Cairo Meeting</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body style="font-family:sans-serif;max-width:900px;margin:auto;padding:16px">
  <h1>Islahuddeen Cairo Meeting</h1>

  <p>เลือกการประชุม:
    <select onchange="openPdf(this.value)">
      <option value="">-- เลือก --</option>
      <option value="pdf/zakfork-2025-2026.pdf">การประชุมซักฟอก ประจำปีการศึกษา 2025/2026 (12 พ.ย. 69)</option>
    </select>
  </p>

  <div id="pages" style="background:#ddd;padding:8px"></div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc =
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

async function openPdf(url){
  const box = document.getElementById("pages");
  box.innerHTML = "";
  if(!url) return;
  box.textContent = "กำลังโหลด...";
  try{
    const pdf = await pdfjsLib.getDocument(url).promise;
    box.innerHTML = "";
    const w = box.clientWidth - 16, dpr = window.devicePixelRatio || 1;
    for(let i = 1; i <= pdf.numPages; i++){
      const page = await pdf.getPage(i);
      const base = page.getViewport({scale:1});
      const vp = page.getViewport({scale: w / base.width * dpr});
      const c = document.createElement("canvas");
      c.width = vp.width; c.height = vp.height;
      c.style.cssText = "width:100%;display:block;margin-bottom:8px";
      box.appendChild(c);
      await page.render({canvasContext:c.getContext("2d"), viewport:vp}).promise;
    }
  }catch(e){
    box.textContent = "เปิดไฟล์ไม่ได้: " + e.message;
  }
}
</script>
</body>
</html>
