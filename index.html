<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Islahuddeen Cairo Meeting</title>
</head>
<body style="font-family:sans-serif;max-width:1000px;margin:auto;padding:16px">
  <h1>Islahuddeen Cairo Meeting</h1>

  <p>เลือกการประชุม:
    <select onchange="openPdf(this.value)">
      <option value="">-- เลือก --</option>
      <option value="pdf/zakfork-2025-2026.pdf">การประชุมซักฟอก ประจำปีการศึกษา 2025/2026 (12 พ.ย. 69)</option>
    </select>
  </p>

  <iframe id="viewer" hidden
    style="width:100%;height:85vh;border:1px solid #ccc"></iframe>

<script>
function openPdf(file){
  const v = document.getElementById("viewer");
  if(!file){ v.hidden = true; return; }
  v.hidden = false;
  v.src = "pdfjs/web/viewer.html?file=" + encodeURIComponent("../../" + file);
}
</script>
</body>
</html>
